---
version: 3

images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform/ee-minimal-rhel9:latest

dependencies:
  galaxy: requirements.yml
  python:
    - boto3>=1.28
    - botocore>=1.31
    - kubernetes>=28.0
    - jmespath>=1.0
  system:
    - openshift-clients [platform:redhat]
    - jq [platform:redhat]

additional_build_steps:
  prepend_final:
    # openshift-install is not packaged — fetch the binary
    - >-
      RUN curl -sL
      https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable-4.22/openshift-install-linux.tar.gz
      | tar -xzf - -C /usr/local/bin openshift-install
      && chmod +x /usr/local/bin/openshift-install
