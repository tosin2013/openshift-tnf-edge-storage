---
# Phase 7b: OpenShift GitOps + OpenShift Virtualization
# Idempotent OLM install. Nested KVM via tna_enabled_nested_kvm
# (standard=true, virt-enabled/metal=false) applied as a KubeVirt jsonpatch
# because HyperConverged.spec.kVMEmulation is gone in CNV 4.22.

- name: Ensure kubeconfig fact is set
  ansible.builtin.set_fact:
    _kubeconfig: "{{ tna_kubeconfig_path }}"
  when: _kubeconfig is not defined

- name: Install OpenShift GitOps operator
  when: tna_install_gitops | bool
  block:
    - name: Apply OpenShift GitOps operator Subscription
      kubernetes.core.k8s:
        kubeconfig: "{{ _kubeconfig }}"
        state: present
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: openshift-gitops-operator
            namespace: openshift-operators
          spec:
            channel: latest
            name: openshift-gitops-operator
            source: redhat-operators
            sourceNamespace: openshift-marketplace
            installPlanApproval: Automatic

    - name: Wait for OpenShift GitOps CSV to succeed
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _kubeconfig }}"
        api_version: operators.coreos.com/v1alpha1
        kind: ClusterServiceVersion
        namespace: openshift-operators
        label_selectors:
          - operators.coreos.com/openshift-gitops-operator.openshift-operators
      register: _gitops_csv
      until: >-
        _gitops_csv.resources | length > 0
        and (_gitops_csv.resources | map(attribute='status.phase') | select('eq', 'Succeeded') | list | length > 0)
      retries: "{{ (tna_csv_timeout / 10) | int }}"
      delay: 10

    - name: Wait for Argo CD application-controller ServiceAccount
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _kubeconfig }}"
        kind: ServiceAccount
        namespace: openshift-gitops
        name: openshift-gitops-argocd-application-controller
      register: _gitops_sa
      until: _gitops_sa.resources | length > 0
      retries: 36
      delay: 5

    - name: Grant Argo CD application controller cluster-admin
      kubernetes.core.k8s:
        kubeconfig: "{{ _kubeconfig }}"
        state: present
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: openshift-gitops-cluster-admin
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: cluster-admin
          subjects:
            - kind: ServiceAccount
              name: openshift-gitops-argocd-application-controller
              namespace: openshift-gitops

    - name: Wait for Argo CD server deployment
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _kubeconfig }}"
        kind: Deployment
        namespace: openshift-gitops
        name: openshift-gitops-server
      register: _gitops_deploy
      until: >-
        _gitops_deploy.resources | length > 0
        and (_gitops_deploy.resources[0].status.availableReplicas | default(0) | int) >= 1
      retries: "{{ (tna_csv_timeout / 10) | int }}"
      delay: 10

- name: Install OpenShift Virtualization
  when: tna_install_cnv | bool
  block:
    - name: Create openshift-cnv namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ _kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: openshift-cnv

    - name: Apply OpenShift Virtualization OperatorGroup
      kubernetes.core.k8s:
        kubeconfig: "{{ _kubeconfig }}"
        state: present
        definition:
          apiVersion: operators.coreos.com/v1
          kind: OperatorGroup
          metadata:
            name: kubevirt-hyperconverged-group
            namespace: openshift-cnv
          spec:
            targetNamespaces:
              - openshift-cnv

    - name: Apply OpenShift Virtualization Subscription
      kubernetes.core.k8s:
        kubeconfig: "{{ _kubeconfig }}"
        state: present
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: kubevirt-hyperconverged
            namespace: openshift-cnv
          spec:
            channel: stable
            name: kubevirt-hyperconverged
            source: redhat-operators
            sourceNamespace: openshift-marketplace
            installPlanApproval: Automatic

    - name: Wait for OpenShift Virtualization CSV to succeed
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _kubeconfig }}"
        api_version: operators.coreos.com/v1alpha1
        kind: ClusterServiceVersion
        namespace: openshift-cnv
      register: _cnv_csv
      until: >-
        _cnv_csv.resources | length > 0
        and (_cnv_csv.resources | map(attribute='status.phase') | select('eq', 'Succeeded') | list | length > 0)
      retries: "{{ ((tna_csv_timeout | int) * 2 / 10) | int }}"
      delay: 10

    - name: Wait for HyperConverged CRD
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _kubeconfig }}"
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: hyperconvergeds.hco.kubevirt.io
      register: _hco_crd
      until: _hco_crd.resources | length > 0
      retries: 36
      delay: 10

    - name: Apply HyperConverged CR
      kubernetes.core.k8s:
        kubeconfig: "{{ _kubeconfig }}"
        state: present
        template: hyperconverged.yml.j2
      register: _hco
      until: _hco is succeeded
      retries: 12
      delay: 10

    - name: Wait for HCO to report Available
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _kubeconfig }}"
        api_version: hco.kubevirt.io/v1beta1
        kind: HyperConverged
        name: kubevirt-hyperconverged
        namespace: openshift-cnv
      register: _hco_status
      until: >-
        _hco_status.resources | length > 0
        and (_hco_status.resources[0].status.conditions
             | default([])
             | selectattr('type', 'eq', 'Available')
             | selectattr('status', 'eq', 'True')
             | list | length > 0)
      retries: 60
      delay: 10

    - name: Delete stale golden-image DataImportCrons
      kubernetes.core.k8s:
        kubeconfig: "{{ _kubeconfig }}"
        api_version: cdi.kubevirt.io/v1beta1
        kind: DataImportCron
        namespace: openshift-virtualization-os-images
        state: absent
        label_selectors:
          - "cdi.kubevirt.io/dataImportCron"
      ignore_errors: true

    - name: Delete golden-image PVCs
      kubernetes.core.k8s:
        kubeconfig: "{{ _kubeconfig }}"
        api_version: v1
        kind: PersistentVolumeClaim
        namespace: openshift-virtualization-os-images
        state: absent
        label_selectors:
          - "cdi.kubevirt.io/dataImportCron"
      ignore_errors: true
