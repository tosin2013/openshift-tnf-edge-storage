[defaults]
# Disable host key checking for dynamic cloud inventory
host_key_checking = False
# Increase timeout for long-running AWS operations
timeout = 60
# Reduce SSH connection overhead
forks = 10
# Readable stdout output
callback_result_format = yaml
# Roles live beside the playbooks
roles_path = ./roles
# Retry files clutter the workspace
retry_files_enabled = False

[privilege_escalation]
become = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
