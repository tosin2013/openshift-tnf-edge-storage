# KVM / Bare-metal TNF overrides
# Single-user only. No hub, no RHACM.
# Apply with: helm template . -f values.yaml -f values-tnf.yaml
#
# MinIO credentials are NOT in this file. Create the Secret out of band:
#
#   oc create namespace linbit-workshop
#   oc create secret generic minio-root -n linbit-workshop \
#     --from-literal=accesskey='<generated>' \
#     --from-literal=secretkey='<generated>'
#
# Then point the TNF MinIO chart/manifest at existingSecret: minio-root.

components:

  linstorOperator:
    storagePool:
      name: lvm-thin
      devicePaths:
        - /dev/vdb
      providerType: "LVM_THIN"

  minio:
    enabled: true
    namespace: linbit-workshop
    existingSecret: minio-root
    bucketName: workshop-backups
