AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  LINBIT Edge Storage Workshop — TNA Student Cluster Infrastructure.
  Provisions a VPC with 3 EC2 instances (2 CP + 1 arbiter), NLB, and
  Route53 records for agent-based OpenShift 4.22+ installation.

Parameters:
  ClusterName:
    Type: String
    Description: Cluster name (e.g. linbit-s1)

  BaseDomain:
    Type: String
    Description: Route53 hosted zone domain (e.g. sandbox2530.opentlc.com)

  HostedZoneId:
    Type: String
    Description: Route53 hosted zone ID for the base domain

  AmiId:
    Type: AWS::EC2::Image::Id
    Description: RHCOS or agent-based installer AMI ID

  CPInstanceType:
    Type: String
    Default: m7a.4xlarge
    Description: Instance type for control plane nodes (16 vCPU, 64 GB)

  ArbiterInstanceType:
    Type: String
    Default: m7a.xlarge
    Description: Instance type for the arbiter node (4 vCPU, 16 GB)

  CPDataVolumeSize:
    Type: Number
    Default: 200
    Description: >-
      Secondary EBS volume (GB) for CP nodes (/dev/xvdb = nvme1n1).
      coreos-installer writes RHCOS here. After install, volume swap
      moves this to /dev/sda1 as the boot device.

  CPLinstorVolumeSize:
    Type: Number
    Default: 50
    Description: >-
      LINSTOR storage pool volume (GB) per CP node (/dev/xvdc = nvme2n1).
      Must be < 100 GB so the assisted-installer cannot select it.
      Used exclusively for lvm-thin pool backing DRBD replicas.

  ArbiterRootVolumeSize:
    Type: Number
    Default: 120
    Description: >-
      Install-target EBS volume size (GB) for the arbiter node.
      Must be >= 100 GB (OpenShift minimum disk requirement).

  KeyName:
    Type: String
    Default: ''
    Description: EC2 key pair name (optional, agent-based installer uses ignition)

  Owner:
    Type: String
    Default: tosin@redhat.com
    Description: Owner tag for AWS resources

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16

  SubnetCidr:
    Type: String
    Default: 10.0.1.0/24

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, '']]

Resources:
  # ─────────────────────────────────────────────────────────────
  # VPC + Networking
  # ─────────────────────────────────────────────────────────────
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${ClusterName}-vpc'
        - Key: owner
          Value: !Ref Owner
        - Key: guid
          Value: !Ref ClusterName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${ClusterName}-igw'

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref SubnetCidr
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${ClusterName}-public'

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${ClusterName}-rt'

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref RouteTable

  # ─────────────────────────────────────────────────────────────
  # Security Groups
  # ─────────────────────────────────────────────────────────────
  ClusterSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${ClusterName} cluster nodes'
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${ClusterName}-cluster-sg'
      SecurityGroupIngress:
        # SSH
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        # Kubernetes API
        - IpProtocol: tcp
          FromPort: 6443
          ToPort: 6443
          CidrIp: 0.0.0.0/0
        # Machine config server (bootstrap)
        - IpProtocol: tcp
          FromPort: 22623
          ToPort: 22623
          CidrIp: !Ref VpcCidr
        # HTTP/HTTPS ingress
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        # NodePort range
        - IpProtocol: tcp
          FromPort: 30000
          ToPort: 32767
          CidrIp: !Ref VpcCidr
        # ICMP
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: !Ref VpcCidr

  ClusterSGSelfIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ClusterSecurityGroup
      IpProtocol: -1
      SourceSecurityGroupId: !Ref ClusterSecurityGroup

  # ─────────────────────────────────────────────────────────────
  # IAM Role for EC2 instances (cert-manager Route53 DNS-01)
  # ─────────────────────────────────────────────────────────────
  NodeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ClusterName}-node-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: Route53Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - route53:ChangeResourceRecordSets
                  - route53:GetChange
                  - route53:ListHostedZones
                  - route53:ListResourceRecordSets
                Resource: '*'
        - PolicyName: EC2Describe
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeVolumes
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                Resource: '*'

  NodeInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${ClusterName}-node-profile'
      Roles:
        - !Ref NodeRole

  # ─────────────────────────────────────────────────────────────
  # EC2 Instances — Control Plane (2x)
  # ─────────────────────────────────────────────────────────────
  ControlPlane0:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref CPInstanceType
      ImageId: !Ref AmiId
      SubnetId: !Ref PublicSubnet
      PrivateIpAddress: '10.0.1.10'
      SecurityGroupIds:
        - !Ref ClusterSecurityGroup
      IamInstanceProfile: !Ref NodeInstanceProfile
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref 'AWS::NoValue']
      BlockDeviceMappings:
        - DeviceName: /dev/xvdb
          Ebs:
            VolumeSize: !Ref CPDataVolumeSize
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
        - DeviceName: /dev/xvdc
          Ebs:
            VolumeSize: !Ref CPLinstorVolumeSize
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub '${ClusterName}-cp-0'
        - Key: owner
          Value: !Ref Owner
        - Key: guid
          Value: !Ref ClusterName
        - Key: role
          Value: control-plane
        - Key: !Sub 'kubernetes.io/cluster/${ClusterName}'
          Value: owned

  ControlPlane1:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref CPInstanceType
      ImageId: !Ref AmiId
      SubnetId: !Ref PublicSubnet
      PrivateIpAddress: '10.0.1.11'
      SecurityGroupIds:
        - !Ref ClusterSecurityGroup
      IamInstanceProfile: !Ref NodeInstanceProfile
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref 'AWS::NoValue']
      BlockDeviceMappings:
        - DeviceName: /dev/xvdb
          Ebs:
            VolumeSize: !Ref CPDataVolumeSize
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
        - DeviceName: /dev/xvdc
          Ebs:
            VolumeSize: !Ref CPLinstorVolumeSize
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub '${ClusterName}-cp-1'
        - Key: owner
          Value: !Ref Owner
        - Key: guid
          Value: !Ref ClusterName
        - Key: role
          Value: control-plane
        - Key: !Sub 'kubernetes.io/cluster/${ClusterName}'
          Value: owned

  # ─────────────────────────────────────────────────────────────
  # EC2 Instance — Arbiter (1x, smaller)
  # The arbiter has only 1 additional volume (/dev/xvdb) for RHCOS.
  # After install, volume swap moves it to /dev/sda1 as boot device.
  # ─────────────────────────────────────────────────────────────
  Arbiter0:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref ArbiterInstanceType
      ImageId: !Ref AmiId
      SubnetId: !Ref PublicSubnet
      PrivateIpAddress: '10.0.1.12'
      SecurityGroupIds:
        - !Ref ClusterSecurityGroup
      IamInstanceProfile: !Ref NodeInstanceProfile
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref 'AWS::NoValue']
      BlockDeviceMappings:
        - DeviceName: /dev/xvdb
          Ebs:
            VolumeSize: !Ref ArbiterRootVolumeSize
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub '${ClusterName}-arbiter-0'
        - Key: owner
          Value: !Ref Owner
        - Key: guid
          Value: !Ref ClusterName
        - Key: role
          Value: arbiter
        - Key: !Sub 'kubernetes.io/cluster/${ClusterName}'
          Value: owned

  # ─────────────────────────────────────────────────────────────
  # Network Load Balancer + Target Groups
  # The NLB ENI is created in the same /24 as the nodes. Without
  # DependsOn, CloudFormation creates it in parallel with the
  # instances and AWS can assign the ENI 10.0.1.12 — the arbiter's
  # static address — which fails Arbiter0 with "Address is in use".
  # Claim .10/.11/.12 first, then let the NLB take a remaining IP.
  # ─────────────────────────────────────────────────────────────
  NLB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn:
      - ControlPlane0
      - ControlPlane1
      - Arbiter0
    Properties:
      Name: !Sub '${ClusterName}-nlb'
      Scheme: internet-facing
      Type: network
      Subnets:
        - !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: !Sub '${ClusterName}-nlb'
        - Key: owner
          Value: !Ref Owner

  # API target group (6443) — all 3 nodes serve API
  APITargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ClusterName}-api'
      Protocol: TCP
      Port: 6443
      VpcId: !Ref VPC
      TargetType: instance
      HealthCheckProtocol: TCP
      HealthCheckPort: '6443'
      Targets:
        - Id: !Ref ControlPlane0
        - Id: !Ref ControlPlane1
        - Id: !Ref Arbiter0

  APIListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref NLB
      Protocol: TCP
      Port: 6443
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref APITargetGroup

  # Machine config server (22623) — CP nodes only
  MCSTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ClusterName}-mcs'
      Protocol: TCP
      Port: 22623
      VpcId: !Ref VPC
      TargetType: instance
      HealthCheckProtocol: TCP
      HealthCheckPort: '22623'
      Targets:
        - Id: !Ref ControlPlane0
        - Id: !Ref ControlPlane1

  MCSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref NLB
      Protocol: TCP
      Port: 22623
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref MCSTargetGroup

  # HTTPS ingress (443) — CP nodes run ingress controller
  HTTPSTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ClusterName}-https'
      Protocol: TCP
      Port: 443
      VpcId: !Ref VPC
      TargetType: instance
      HealthCheckProtocol: TCP
      HealthCheckPort: '443'
      Targets:
        - Id: !Ref ControlPlane0
        - Id: !Ref ControlPlane1

  HTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref NLB
      Protocol: TCP
      Port: 443
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref HTTPSTargetGroup

  # HTTP ingress (80) — CP nodes
  HTTPTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ClusterName}-http'
      Protocol: TCP
      Port: 80
      VpcId: !Ref VPC
      TargetType: instance
      HealthCheckProtocol: TCP
      HealthCheckPort: '80'
      Targets:
        - Id: !Ref ControlPlane0
        - Id: !Ref ControlPlane1

  HTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref NLB
      Protocol: TCP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref HTTPTargetGroup

  # ─────────────────────────────────────────────────────────────
  # Route53 DNS Records
  # ─────────────────────────────────────────────────────────────
  APIDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'api.${ClusterName}.${BaseDomain}.'
      Type: A
      AliasTarget:
        HostedZoneId: !GetAtt NLB.CanonicalHostedZoneID
        DNSName: !GetAtt NLB.DNSName
        EvaluateTargetHealth: false

  # api-int is NOT managed here. The NLB hairpin workaround in
  # phase2_cloudformation.yml creates it as a simple A → CP private IPs.
  # Managing it in CFN causes type collisions on re-deploy (alias vs simple-A).

  WildcardAppsDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub '*.apps.${ClusterName}.${BaseDomain}.'
      Type: A
      AliasTarget:
        HostedZoneId: !GetAtt NLB.CanonicalHostedZoneID
        DNSName: !GetAtt NLB.DNSName
        EvaluateTargetHealth: false

Outputs:
  VpcId:
    Value: !Ref VPC

  SubnetId:
    Value: !Ref PublicSubnet

  SecurityGroupId:
    Value: !Ref ClusterSecurityGroup

  ControlPlane0InstanceId:
    Value: !Ref ControlPlane0

  ControlPlane0PrivateIp:
    Value: !GetAtt ControlPlane0.PrivateIp

  ControlPlane1InstanceId:
    Value: !Ref ControlPlane1

  ControlPlane1PrivateIp:
    Value: !GetAtt ControlPlane1.PrivateIp

  Arbiter0InstanceId:
    Value: !Ref Arbiter0

  Arbiter0PrivateIp:
    Value: !GetAtt Arbiter0.PrivateIp

  NLBDNSName:
    Value: !GetAtt NLB.DNSName

  APIURL:
    Value: !Sub 'https://api.${ClusterName}.${BaseDomain}:6443'

  ConsoleURL:
    Value: !Sub 'https://console-openshift-console.apps.${ClusterName}.${BaseDomain}'

  AppsWildcard:
    Value: !Sub '*.apps.${ClusterName}.${BaseDomain}'
